[package]
name = "plaza_ws"
version = "0.6.0"
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "One client-side WebSocket interface across desktop, browser, and in-process, for frame-loop applications."
readme = "README.md"
keywords = ["websocket", "gamedev", "wasm", "networking", "client"]
categories = ["network-programming", "game-development", "wasm"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["loopback"]
loopback = []
json = ["dep:serde", "dep:serde_json"]
native = ["dep:tungstenite"]
miniquad = []
scripted = ["dep:parking_lot"]
pump = ["dep:plaza_wire", "dep:plaza_client_utils", "dep:serde"]

[dependencies]
parking_lot = { version = "^0.12", optional = true }
plaza_client_utils = { version = "0.6", path = "../client_utils", optional = true }
plaza_wire = { version = "0.7", path = "../wire", optional = true, default-features = false, features = ["serde"] }
serde = { version = "^1", optional = true }
serde_json = { version = "^1", optional = true }
tungstenite = { version = "^0.24", optional = true, features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
macroquad = "=0.4.15"
serde_json = "^1"

[[example]]
name = "echo"
required-features = ["native"]

[[example]]
name = "echo_server"
required-features = ["native"]

[[example]]
name = "echo_web"
required-features = ["miniquad"]
