name: plaza_client
description: >-
  The plaza session lifecycle in Dart. Handshake, ops, reconnect and resume,
  over a socket you supply.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  plaza_wire:
    path: ../plaza_wire
  plaza_client_utils:
    path: ../plaza_client_utils

dev_dependencies:
  test: ^1.25.0
