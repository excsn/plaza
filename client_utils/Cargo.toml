[package]
name = "plaza_client_utils"
version = "0.5.0"
edition = { workspace = true }
license = { workspace = true }

authors = { workspace = true }
description = "Client-side prediction, server reconciliation, and entity smoothing for real-time applications. No async runtime and no server crates, so it builds for wasm."
repository = { workspace = true }
readme = "README.md"
keywords = ["gamedev", "networking", "multiplayer", "prediction", "reconciliation"]
categories = ["game-development", "network-programming"]

[package.metadata.docs.rs]
all-features = true

[features]
net-sim = []

[dependencies]
thiserror = { workspace = true }
tracing = "^0"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }