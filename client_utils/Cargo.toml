[package]
name = "plaza_client_utils"
version = "0.5.0"
edition = { workspace = true }
license = { workspace = true }

authors = { workspace = true }
description = "Client-side prediction, server reconciliation, and entity smoothing for real-time applications. No async runtime and no server crates, so it builds for wasm."
repository = { workspace = true }
readme = "README.md"
keywords = ["gamedev", "networking", "multiplayer", "prediction", "reconciliation"]
categories = ["game-development", "network-programming"]

[features]
# An opt-in deterministic network simulator (latency, jitter, loss) for testing
# and demonstrating netcode. Not part of the core client API.
net-sim = []

[dependencies]
thiserror = { workspace = true }
tracing = "^0"

[dev-dependencies]
# For writing unit tests for this crate's utilities.
uuid = { version = "1", features = ["v4"] } # Example for IDs in tests
serde = { version = "1.0", features = ["derive"] } # If test structs need serde
# tokio = { version = "1", features = ["macros", "rt-multi-thread"] } # If tests involve async (not initially)
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] } # For running tests with logs