[package]
name = "plaza"
version = "0.6.0"
edition = { workspace = true }
readme = "README.md"
keywords = ["gamedev", "networking", "multiplayer", "realtime", "state"]
categories = ["game-development", "network-programming", "asynchronous"]
license = { workspace = true }

description = "A server-authoritative foundation for real-time shared state: multiplayer games, collaborative editors, and anything where many clients change one piece of state."
authors = { workspace = true }
repository = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[dependencies]
plaza_wire = { version = "0.6.0", path = "../wire" }
serde = { workspace = true }
async-trait = { workspace = true }
fibre = { workspace = true }
parking_lot = "^0.12"
thiserror = { workspace = true }
tokio = { version = "^1", features = ["macros", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { version = "^1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = []
