[package]
name = "plaza_lobby"
version = "0.6.0"
edition = { workspace = true }
keywords = ["gamedev", "networking", "multiplayer", "lobby", "matchmaking"]
categories = ["game-development", "network-programming"]
license = { workspace = true }

description = "Single-server lobby and room management for the Plaza real-time shared-state framework."
authors = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[dependencies]
plaza = { version = "0.6.0", path = "../core" }

async-trait = { workspace = true }
fibre = { workspace = true }
serde = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["sync", "rt"] }
tracing = "0.1"
parking_lot = "0.12"
thiserror = { workspace = true }

[dev-dependencies]
