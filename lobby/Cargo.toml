[package]
name = "plaza_lobby"
version = "0.1.0"
edition = { workspace = true }
keywords = ["gamedev", "networking", "multiplayer", "lobby", "matchmaking"]
categories = ["game-development", "network-programming"]
license = { workspace = true }

description = "Single-server lobby and room management for the Plaza real-time shared-state framework."
authors = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
plaza = { version = "0.1.0", path = "../core" } # Dependency on plaza-core

async-trait = { workspace = true }
fibre = { workspace = true }
serde = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] } # For RoomId
tokio = { version = "1", features = ["sync", "rt"] } # For Mutex, mpsc, spawn
tracing = "0.1"
parking_lot = "0.12"
thiserror = { workspace = true }

[dev-dependencies]
# For examples or tests within this crate
# tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# tracing-subscriber = { version = "0.3", features = ["env-filter"] }