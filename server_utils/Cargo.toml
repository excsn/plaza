[package]
name = "plaza_server_utils"
version = "0.6.0"
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Server-side building blocks for real-time netcode: relevance streaming, delta baselines, lag-compensation rewind, aggregation, and seat allocation. No async runtime, so it builds for wasm."
readme = "README.md"
keywords = ["gamedev", "networking", "multiplayer", "lag-compensation", "server"]
categories = ["game-development", "network-programming"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
plaza_client_utils = { version = "0.6.0", path = "../client_utils" }
tracing = "^0"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
