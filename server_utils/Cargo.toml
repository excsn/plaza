[package]
name = "plaza_server_utils"
version = "0.1.0"
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Server-side building blocks for real-time netcode: historical state rewind for lag compensation. Zero-dependency and wasm-compatible."
readme = "README.md"
keywords = ["gamedev", "networking", "multiplayer", "lag-compensation", "server"]
