[package]
name = "plaza_wire"
version = "0.6.1"
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "The wire format trait shared by Plaza servers and clients. Pure serde, no async runtime."
readme = "README.md"
keywords = ["serialization", "codec", "gamedev", "networking", "wasm"]
categories = ["encoding", "network-programming", "game-development"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["json"]
# The wire vocabulary: `AgentId`'s serde bound, `Agent`, the frame bodies, the
# codec trait and the payload types. Off, this crate is the framing byte and
# the identity types, which is all an in-process application ever touches.
serde = ["dep:serde"]
json = ["dep:serde_json", "serde"]
msgpack = ["dep:rmp-serde", "serde"]
build = ["dep:syn", "dep:proc-macro2"]

[dependencies]
serde = { version = "^1.0", features = ["derive"], optional = true }
serde_json = { version = "^1.0", optional = true }
rmp-serde = { version = "^1", optional = true }
syn = { version = "2", features = ["full"], optional = true }
proc-macro2 = { version = "1", features = ["span-locations"], optional = true }

[dev-dependencies]
plaza_client_utils = { path = "../client_utils" }
criterion = { version = "^0", features = ["html_reports"] }

[[bench]]
name = "wire"
harness = false
