[package]
name = "plaza_wire"
version = "0.6.1"
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "The wire format trait shared by Plaza servers and clients. Pure serde, no async runtime."
readme = "README.md"
keywords = ["serialization", "codec", "gamedev", "networking", "wasm"]
categories = ["encoding", "network-programming", "game-development"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["json"]
json = ["dep:serde_json"]
msgpack = ["dep:rmp-serde"]
build = []

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0", optional = true }
rmp-serde = { version = "^1", optional = true }

[dev-dependencies]
plaza_client_utils = { path = "../client_utils" }
criterion = { version = "^0", features = ["html_reports"] }

[[bench]]
name = "wire"
harness = false
