[package]
name = "plaza_wire"
version = "0.5.0"
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "The wire format trait shared by Plaza servers and clients. Pure serde, no async runtime."
readme = "README.md"
keywords = ["serialization", "codec", "gamedev", "networking", "wasm"]
categories = ["encoding", "network-programming", "game-development"]

[features]
default = ["json"]
json = ["dep:serde_json"]
# Build-script support: derives a wire format version by hashing the source that
# defines it. Meant for `[build-dependencies]`, not for the running program, so
# it is off by default and pairs with `default-features = false`.
build = []

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0", optional = true }
