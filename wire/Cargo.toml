[package]
name = "plaza_wire"
version = "0.5.0"
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "The wire format trait shared by Plaza servers and clients. Pure serde, no async runtime."
readme = "README.md"
keywords = ["serialization", "codec", "gamedev", "networking", "wasm"]
categories = ["encoding", "network-programming", "game-development"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["json"]
json = ["dep:serde_json"]
build = []

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0", optional = true }
