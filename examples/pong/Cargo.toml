[package]
name = "plaza_example_pong"
version = "0.1.0"
edition = { workspace = true }
publish = false

[dependencies]
plaza = { workspace = true }
plaza_session = { workspace = true, features = ["actix_ws", "json", "actix_host"] }

actix-web = "^4"
async-trait = { workspace = true }
rand = "0.8"
serde = { version = "^1.0", features = ["derive"] }
tokio = { version = "^1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "^0.1"
uuid = { version = "^1", features = ["v4", "serde"] }
