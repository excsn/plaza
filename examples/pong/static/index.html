<!DOCTYPE html>
<html>
<head>
    <title>Plaza Pong</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #333; }
        canvas { border: 1px solid #fff; background-color: #000; }
    </style>
</head>
<body>
    <canvas id="pongCanvas"></canvas>
    <script src="plaza_protocol.js"></script>
    <script>
        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');

        const SCREEN_WIDTH = 800;
        const SCREEN_HEIGHT = 600;
        canvas.width = SCREEN_WIDTH;
        canvas.height = SCREEN_HEIGHT;

        let ws;
        let myPlayerId = null;
        let mySide = null; // 'Left' or 'Right'
        let gameState = null;

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            ws = new WebSocket(`${protocol}//${host}/ws`);

            ws.onopen = () => console.log('Connected to Pong server');

            ws.onmessage = (event) => onJsonFrame(ws, event.data, handleServerOp);

            ws.onclose = () => {
                console.log('Disconnected from Pong server');
                myPlayerId = null;
                mySide = null;
                gameState = null;
                // Optionally, try to reconnect
            };

            ws.onerror = (error) => {
                console.error('WebSocket Error: ', error);
            };
        }

        // The body of a KIND_OPS frame is the ops array itself: `from` is the
        // server's own bookkeeping and is not sent.
        function sendOps(ops) {
            ws.send(jsonFrame(KIND_OPS, ops));
        }

        // One message kind. A snapshot is an op like any other, so there is
        // a single handler rather than an Ops-versus-StateData branch.
        function handleServerOp(op) {
            const body = opBody(op);
            switch (opName(op)) {
            case 'Snapshot':
                // The whole world, every tick. It replaces the local copy
                // outright rather than being merged into it, so nothing
                // here patches fields a later frame would overwrite.
                gameState = body;
                if (gameState && myPlayerId) {
                    if (gameState.player1_id === myPlayerId) mySide = "Left";
                    else if (gameState.player2_id === myPlayerId) mySide = "Right";
                }
                draw();
                break;
            case 'AssignPlayer':
                myPlayerId = body.player_id;
                mySide = body.side;
                console.log(`Assigned as ${mySide} player: ${myPlayerId}`);
                break;
            case 'ScoreUpdate':
                // An event, not state: the next snapshot carries the score.
                console.log(`Point to ${body.player_id}: ${body.new_score}`);
                break;
            case 'PhaseChange':
                // Nothing is answered automatically any more. The phases run
                // themselves on the server, and a client that replied here
                // was the only reason a countdown ever ended.
                console.log(`phase: ${body}`);
                break;
            }
        }

        function sendPaddleMove(targetY) {
            if (ws && ws.readyState === WebSocket.OPEN && myPlayerId && gameState && gameState.phase === "Playing") {
                sendOps([{ MovePaddle: { target_y: targetY } }]);
            }
        }
        
        function sendReadyToPlay() {
            if (ws && ws.readyState === WebSocket.OPEN && myPlayerId) {
                 console.log("Sending ReadyToPlay");
                 sendOps([{ ReadyToPlay: null }]);
            }
        }

        // --- Drawing ---
        function drawPaddle(paddle) {
            if (!paddle) return;
            ctx.fillStyle = '#fff';
            ctx.fillRect(paddle.x, paddle.y - paddle.height / 2, paddle.width, paddle.height);
        }

        function drawBall(ball) {
            if (!ball) return;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.closePath();
        }

        function drawScores() {
            if (!gameState || !gameState.scores) return;
            ctx.font = '30px Arial';
            ctx.fillStyle = '#fff';
            if (gameState.player1_id && gameState.scores[gameState.player1_id] !== undefined) {
                ctx.fillText(gameState.scores[gameState.player1_id], SCREEN_WIDTH / 4, 50);
            }
            if (gameState.player2_id && gameState.scores[gameState.player2_id] !== undefined) {
                ctx.fillText(gameState.scores[gameState.player2_id], (SCREEN_WIDTH * 3) / 4, 50);
            }
        }
        
        function drawPhase() {
            if (!gameState || !gameState.phase) return;
            ctx.font = '24px Arial';
            ctx.fillStyle = '#aaa';
            const left = gameState.countdown;
            let text = "";
            switch(gameState.phase) {
                case "WaitingForPlayers": text = "Waiting for opponent..."; break;
                case "Starting": text = left > 0 ? `Get Ready! ${left}` : "Get Ready!"; break;
                case "Paused": text = left > 0 ? `Point! Resuming in ${left}` : "Paused"; break;
                case "GameOver": {
                    const scores = gameState.scores || {};
                    const [winnerId] = Object.entries(scores)
                        .sort(([, a], [, b]) => b - a)[0] || [];
                    const winner = winnerId === undefined ? "Nobody"
                        : winnerId === myPlayerId ? "You"
                        : (gameState.bots || []).includes(winnerId) ? "The bot"
                        : gameState.player1_id === winnerId ? "Player 1" : "Player 2";
                    text = `Game Over! ${winner} ${winner === "You" ? "win" : "wins"}!`
                        + (left > 0 ? `  New game in ${left}` : "");
                    break;
                }
            }
            if (text) {
                 const textWidth = ctx.measureText(text).width;
                 ctx.fillText(text, (SCREEN_WIDTH - textWidth) / 2, SCREEN_HEIGHT / 2 - 30);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear canvas

            if (!gameState) {
                ctx.font = '20px Arial';
                ctx.fillStyle = '#fff';
                ctx.fillText('Connecting...', SCREEN_WIDTH / 2 - 50, SCREEN_HEIGHT / 2);
                return;
            }
            
            // Draw paddles
            if (gameState.paddles) {
                 for (const playerId in gameState.paddles) {
                    drawPaddle(gameState.paddles[playerId]);
                 }
            }


            // Draw ball
            if (gameState.ball) {
                drawBall(gameState.ball);
            }

            // Draw scores
            drawScores();
            drawPhase();
        }

        // --- Input Handling ---
        canvas.addEventListener('mousemove', (event) => {
            if (mySide && gameState && gameState.paddles && gameState.paddles[myPlayerId]) {
                const rect = canvas.getBoundingClientRect();
                const mouseY = event.clientY - rect.top;
                sendPaddleMove(mouseY);
            }
        });
        
        // A countdown you can cut short, which is what ReadyToPlay now means.
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && gameState && gameState.countdown > 0) {
                e.preventDefault();
                sendReadyToPlay();
            }
        });

        // Initial connection
        connect();
        draw(); // Initial draw (e.g., "Connecting...")
    </script>
</body>
</html>
