[package]
name = "plaza_example_typing_indicator"
version = "0.1.0"
edition = { workspace = true }
publish = false

[dependencies]
plaza = { path = "../../core" }

async-trait = { workspace = true } # If example traits are async
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12" # If scheduler is in StateLogic