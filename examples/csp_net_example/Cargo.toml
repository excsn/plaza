[package]
name = "plaza_csp_net_example"
version = "0.1.0"
edition = { workspace = true }
publish = false

[dependencies]
plaza = { workspace = true }
plaza_client_utils = { workspace = true }

tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rand = "0.8"
async-trait = "0.1"
fibre = { workspace = true }

