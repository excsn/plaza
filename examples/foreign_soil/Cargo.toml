[package]
name = "plaza_example_foreign_soil"
version = "0.1.0"
edition = { workspace = true }
publish = false

# Deliberately no `actix_ws` and no `tcp`: this example exists to find out what
# the published seam gives a transport plaza did not ship, and borrowing a
# feature from a shipped adapter would hide the answer. Features are named
# exactly, because the examples workspace unifies them across members and a
# sibling would otherwise cover for anything left out.
[dependencies]
plaza = { workspace = true }
plaza_session = { workspace = true, features = ["json"] }
plaza_wire = { workspace = true, features = ["json"] }

async-trait = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
