<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>draft board</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 46rem; color: #1b1b1b; }
  h1 { font-size: 1.2rem; margin: 0 0 .2rem; }
  #phase { font-size: 1rem; font-weight: 600; margin: 0 0 1rem; color: #444; }
  #status { min-height: 1.5rem; margin: 0 0 1rem; }
  #status.turn { font-weight: 600; color: #0a6; }
  .order { display: flex; gap: .4rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
  .seat { padding: .2rem .6rem; border: 1px solid #ccc; border-radius: 999px; }
  .seat.up { border-color: #0a6; background: #eafaf3; font-weight: 600; }
  .seat.me { text-decoration: underline; }
  .arrow { color: #888; }
  #pool { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .prospect { padding: .5rem .7rem; border: 1px solid #bbb; border-radius: 6px; background: #fff; }
  .prospect.pickable { cursor: pointer; border-color: #0a6; }
  .prospect.pickable:hover { background: #eafaf3; }
  .roster { margin-bottom: .4rem; }
  .roster .took { color: #555; }
  #log { margin-top: 1.5rem; font-size: 13px; color: #666; max-height: 12rem; overflow-y: auto; }
  #log div { padding: .1rem 0; }
</style>
</head>
<body>
<h1>draft board</h1>
<p id="phase">connecting…</p>
<p id="status"></p>

<div class="order" id="order"></div>
<div id="pool"></div>
<div id="rosters"></div>
<div id="log"></div>

<script>
(() => {
  // The wire is [kind: u8][json]. These must match `plaza_wire::frame::Kind`;
  // `examples/check_pages.py` is what says so, because nothing compiles this.
  const KIND_OPS = 0;
  const KIND_PING = 2;
  const KIND_PONG = 3;

  const el = (id) => document.getElementById(id);
  let board = null;
  let me = null;

  function log(line) {
    const row = document.createElement('div');
    row.textContent = line;
    el('log').prepend(row);
    while (el('log').childElementCount > 40) el('log').lastElementChild.remove();
  }

  function seatName(id) {
    return id === me ? `P${id} (you)` : `P${id}`;
  }

  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws`);

    ws.onopen = () => log('connected');
    ws.onclose = () => { board = null; el('phase').textContent = 'disconnected'; };

    ws.onmessage = (event) => {
      const kind = event.data.charCodeAt(0);
      if (kind === KIND_PING) {
        const ping = JSON.parse(event.data.slice(1));
        ws.send(String.fromCharCode(KIND_PONG) + JSON.stringify({ origin: ping.origin, responder: null }));
        return;
      }
      if (kind !== KIND_OPS) return;

      let ops;
      try { ops = JSON.parse(event.data.slice(1)); }
      catch (e) { log(`undecodable frame: ${e.message}`); return; }

      for (const op of ops) {
        if (op.Snapshot) board = op.Snapshot;
        else if (op.YouAre !== undefined) { me = op.YouAre; log(`you are P${me}`); }
        else if (op.Taken) {
          const how = op.Taken.on_their_behalf ? ' (clock ran out)' : '';
          log(`${seatName(op.Taken.player)} took #${op.Taken.prospect.id} worth ${op.Taken.prospect.value}${how}`);
        }
        else if (op.Refused) log(`refused: ${op.Refused}`);
        else if (op.DraftOver) log(`draft over: ${op.DraftOver.standings.map(([p, v]) => `P${p} ${v}`).join(', ')}`);
        else if (op.RoundStarted) log(`round ${op.RoundStarted.round_number}`);
      }
      render(ws);
    };
  }

  function render(ws) {
    if (!board) return;

    el('phase').textContent = board.phase === 'Picking'
      ? `${board.phase}, round ${board.round} of ${board.total_rounds}${board.reversed ? ' (order reversed)' : ''}`
      : board.phase;

    // The order, drawn in the direction it is currently running. This is the
    // whole example: watch the arrows flip at the end of every pass.
    const order = board.reversed ? [...board.order].reverse() : board.order;
    el('order').innerHTML = '';
    order.forEach((player, i) => {
      if (i > 0) {
        const arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.textContent = '→';
        el('order').appendChild(arrow);
      }
      const seat = document.createElement('span');
      seat.className = 'seat'
        + (player === board.on_the_clock ? ' up' : '')
        + (player === me ? ' me' : '');
      seat.textContent = seatName(player);
      el('order').appendChild(seat);
    });

    const mine = board.on_the_clock === me && board.phase === 'Picking';
    el('pool').innerHTML = '';
    for (const prospect of board.available) {
      const node = document.createElement('div');
      node.className = 'prospect' + (mine ? ' pickable' : '');
      node.textContent = `#${prospect.id} · ${prospect.value}`;
      if (mine) {
        node.onclick = () => ws.send(String.fromCharCode(KIND_OPS) + JSON.stringify([{ Take: prospect.id }]));
      }
      el('pool').appendChild(node);
    }

    el('rosters').innerHTML = '';
    for (const [player, roster] of board.rosters) {
      const total = roster.reduce((sum, p) => sum + p.value, 0);
      const row = document.createElement('div');
      row.className = 'roster';
      const took = roster.length ? roster.map((p) => `#${p.id}`).join(' ') : 'nothing yet';
      row.innerHTML = `<strong>${seatName(player)}</strong> <span class="took">${took}</span> · ${total}`;
      el('rosters').appendChild(row);
    }

    const status = el('status');
    if (board.phase === 'Finished') {
      const [top] = board.standings || [];
      status.textContent = top ? `P${top[0]} wins with ${top[1]}, racking again shortly` : 'draft over, racking again shortly';
      status.className = '';
    } else if (mine) {
      status.textContent = 'your pick, click a prospect';
      status.className = 'turn';
    } else if (board.on_the_clock !== null && board.on_the_clock !== undefined) {
      status.textContent = `on the clock: P${board.on_the_clock}`;
      status.className = '';
    } else {
      status.textContent = 'waiting for three drafters';
      status.className = '';
    }
  }

  connect();
})();
</script>
</body>
</html>
