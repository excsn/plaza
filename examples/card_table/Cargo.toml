[package]
name = "plaza_example_card_table"
version = "0.1.0"
edition = { workspace = true }
publish = false
# Adding `serve` made a bare `cargo run -p plaza_example_card_table` ambiguous.
default-run = "plaza_example_card_table"

[dependencies]
plaza = { workspace = true }
plaza_wire = { workspace = true }
plaza_session = { workspace = true, features = ["actix_ws", "json", "actix_host"] }

actix-web = "^4"
tokio = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
plaza_wire = { workspace = true, features = ["build"] }
