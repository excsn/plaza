<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>night watch</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 44rem; color: #1b1b1b; }
  body.night { background: #10131c; color: #cfd6e4; }
  h1 { font-size: 1.2rem; margin: 0 0 .2rem; }
  #phase { font-size: 1rem; font-weight: 600; margin: 0 0 .4rem; }
  #role { margin: 0 0 1rem; }
  #role strong.wolf { color: #c0392b; }
  #status { min-height: 1.5rem; margin: 0 0 1rem; }
  #status.turn { font-weight: 600; color: #0a6; }
  #living { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .villager { padding: .5rem .7rem; border: 1px solid #999; border-radius: 6px; }
  body.night .villager { border-color: #445; background: #1a1f2c; }
  .villager.pickable { cursor: pointer; border-color: #0a6; }
  .villager.voted::after { content: " ✓"; color: #0a6; }
  .villager.me { text-decoration: underline; }
  #dead { margin-bottom: 1rem; color: #888; }
  #reveal { margin-bottom: 1rem; }
  #log { margin-top: 1rem; font-size: 13px; color: #777; max-height: 12rem; overflow-y: auto; }
  #log div { padding: .1rem 0; }
</style>
</head>
<body>
<h1>night watch</h1>
<p id="phase">connecting…</p>
<p id="role"></p>
<p id="status"></p>
<div id="living"></div>
<div id="dead"></div>
<div id="reveal"></div>
<div id="log"></div>

<script src="plaza_protocol.js"></script>
<script>
(() => {
  const el = (id) => document.getElementById(id);
  let village = null;
  let me = null;

  function log(line) {
    const row = document.createElement('div');
    row.textContent = line;
    el('log').prepend(row);
    while (el('log').childElementCount > 40) el('log').lastElementChild.remove();
  }

  function name(id) {
    return id === me ? `P${id} (you)` : `P${id}`;
  }

  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => log('connected');
    ws.onclose = () => { village = null; el('phase').textContent = 'disconnected'; };

    ws.onmessage = (event) => onJsonFrame(ws, event.data, (op) => {
      if (op.Snapshot) village = op.Snapshot;
      else if (op.YouAre !== undefined) { me = op.YouAre; log(`you are P${me}`); }
      else if (op.Dawn) log(`dawn: ${name(op.Dawn.victim)} was taken, a ${op.Dawn.role}`);
      else if (op.VotesTallied) {
        const t = op.VotesTallied;
        const exiled = t.exiled ? `${name(t.exiled[0])} the ${t.exiled[1]} is exiled` : 'nobody is exiled';
        log(`dusk: ${exiled}`);
      }
      else if (op.GameOver) log(`game over: ${op.GameOver.winner} wins`);
      else if (op.Refused) log(`refused: ${op.Refused}`);
      else if (op.PhaseChanged && op.PhaseChanged.reason) log(op.PhaseChanged.reason);
      render(ws);
    });
  }

  function render(ws) {
    if (!village) return;
    document.body.classList.toggle('night', village.phase === 'Night');

    el('phase').textContent = village.phase === 'Waiting'
      ? `waiting for villagers (game ${village.games + 1})`
      : `${village.phase}, night ${village.round} (game ${village.games})`;

    const iAmWolf = village.your_role === 'Wolf';
    el('role').innerHTML = village.your_role
      ? `you are a <strong class="${iAmWolf ? 'wolf' : ''}">${village.your_role}</strong>`
      : 'you are watching';

    const alive = village.living.includes(me);
    const canHunt = village.phase === 'Night' && iAmWolf && alive;
    const canVote = village.phase === 'Day' && alive;

    el('living').innerHTML = '';
    for (const p of village.living) {
      const node = document.createElement('div');
      const clickable = (canHunt && p !== me) || canVote;
      node.className = 'villager'
        + (clickable ? ' pickable' : '')
        + (village.voted.includes(p) ? ' voted' : '')
        + (p === me ? ' me' : '');
      node.textContent = name(p);
      if (clickable) {
        node.onclick = () => {
          const op = canHunt ? { Hunt: p } : { Vote: p };
          ws.send(jsonFrame(KIND_OPS, [op]));
        };
      }
      el('living').appendChild(node);
    }

    el('dead').textContent = village.dead.length
      ? 'fallen: ' + village.dead.map(([p, r]) => `${name(p)} (${r})`).join(', ')
      : '';

    // The dead see everything; the living see this empty.
    el('reveal').textContent = village.everyone
      ? 'you see all: ' + village.everyone.map(([p, r]) => `${name(p)} is a ${r}`).join(', ')
      : '';

    const status = el('status');
    if (village.phase === 'Over') {
      status.textContent = `${village.winner} wins; dealing again shortly`;
      status.className = '';
    } else if (canHunt) {
      status.textContent = 'choose tonight\'s victim';
      status.className = 'turn';
    } else if (canVote) {
      status.textContent = village.your_vote !== null && village.your_vote !== undefined
        ? `you voted for P${village.your_vote}; you may change it until dusk`
        : 'vote to exile someone';
      status.className = 'turn';
    } else if (village.phase === 'Night') {
      status.textContent = alive ? 'the village sleeps' : 'you are dead, and you watch';
      status.className = '';
    } else {
      status.textContent = alive ? 'waiting' : 'you are dead, and you watch';
      status.className = '';
    }
  }

  connect();
})();
</script>
</body>
</html>
