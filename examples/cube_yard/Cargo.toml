[package]
name = "cube_yard"
version = "0.1.0"
edition = { workspace = true }
publish = false
default-run = "cube_yard"

[features]
default = ["native", "client", "server", "websocket"]
client = []
server = ["dep:plaza_session", "dep:plaza_server_utils", "dep:plaza_wire", "dep:rapier3d", "dep:actix-web", "dep:tokio", "dep:async-trait", "dep:tracing"]
native = ["plaza_ws/native"]
web = ["client", "websocket", "plaza_ws/miniquad"]
websocket = ["dep:plaza_ws", "dep:plaza_wire"]

[dependencies]
plaza = { workspace = true }
plaza_client_utils = { workspace = true }
playground_common = { workspace = true }
serde = { workspace = true }

plaza_ws = { workspace = true, optional = true, features = ["pump"] }
plaza_wire = { workspace = true, optional = true, features = ["default", "msgpack"] }
plaza_session = { workspace = true, features = ["default", "actix_host"], optional = true }
plaza_server_utils = { workspace = true, optional = true }
actix-web = { version = "^4", optional = true }
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

# Server-side only, and the opposite configuration to puck_rink's: state sync
# does not re-simulate on the client, so nothing here needs determinism and
# `parallel` is free to take.
rapier3d = { version = "=0.35.1", optional = true, default-features = false, features = [
  "dim3",
  "f32",
  "std",
  "alloc",
  "block-solver",
  "parallel",
] }

macroquad = "=0.4.15"
egui-macroquad = "=0.17.3"

[dev-dependencies]
plaza_ws = { workspace = true, features = ["scripted"] }
tokio = { workspace = true }

[build-dependencies]
plaza_wire = { workspace = true, features = ["build"] }

[lib]
name = "cube_yard"
path = "src/lib.rs"

[[bin]]
name = "cube_yard"
path = "src/main.rs"
