[package]
name = "plaza_example_field_orders"
version = "0.1.0"
edition = { workspace = true }
publish = false
default-run = "field_orders"

[features]
default = ["native", "client", "server", "websocket"]
client = []
server = ["dep:plaza_session", "dep:plaza_wire", "dep:actix-web", "dep:tokio", "dep:async-trait", "dep:tracing"]
native = ["plaza_ws/native"]
web = ["client", "websocket", "plaza_ws/miniquad"]
websocket = ["dep:plaza_ws", "dep:plaza_wire"]

[dependencies]
# Not server-gated: the wire ops carry plaza's flow_control notice payloads, and
# the crate compiles to wasm32, so the browser client reuses the real types
# rather than mirroring them.
plaza = { workspace = true }
playground_common = { workspace = true }
serde = { workspace = true }

plaza_ws = { workspace = true, optional = true, features = ["pump"] }
plaza_wire = { workspace = true, optional = true, features = ["default", "msgpack"] }
plaza_session = { workspace = true, features = ["default", "actix_host"], optional = true }
actix-web = { version = "^4", optional = true }
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

macroquad = "=0.4.15"
egui-macroquad = "=0.17.3"

[dev-dependencies]
plaza_ws = { workspace = true, features = ["scripted"] }
tokio = { workspace = true }

[build-dependencies]
plaza_wire = { workspace = true, features = ["build"] }

[lib]
name = "plaza_example_field_orders"
path = "src/lib.rs"

[[bin]]
name = "field_orders"
path = "src/main.rs"

[[bin]]
name = "scripted"
path = "src/bin/scripted.rs"
required-features = ["server"]
