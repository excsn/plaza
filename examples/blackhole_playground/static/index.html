<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plaza Black Hole</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    /* Fill the viewport; macroquad sizes its drawing buffer to the canvas. */
    canvas#glcanvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <!-- macroquad renders into this canvas; the id is required by the loader. -->
  <canvas id="glcanvas" tabindex="1"></canvas>
  <!-- Vendored macroquad/miniquad JS loader; defines load(). -->
  <script src="mq_js_bundle.js"></script>
  <!-- The WebSocket plugin. Must come after the bundle (which defines
       miniquad_add_plugin) and before load() (which instantiates). -->
  <script src="plaza_ws.js"></script>
  <script>load("blackhole_playground.wasm");</script>
</body>
</html>
