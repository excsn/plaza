[package]
name = "horde_playground"
version = "0.1.0"
edition = { workspace = true }
publish = false # It's an example

[features]
default = ["native", "client", "server", "websocket"]
# What a person wants to build, not the crates behind it.
client = []
# Not available on `web`: a browser cannot accept incoming connections.
server = ["dep:plaza", "dep:plaza_session", "dep:actix-web", "dep:actix-files", "dep:tokio", "dep:async-trait", "dep:tracing", "dep:tracing-subscriber"]
native = ["plaza_ws/native"]
web = ["client", "websocket", "plaza_ws/miniquad"]
websocket = ["dep:plaza_ws", "dep:plaza_wire", "dep:serde_json"]

# The many-entity case: server relevance (server_utils) plus client smoothing
# (client_utils), over a real socket or the deterministic net-sim link.
[dependencies]
plaza_client_utils = { path = "../../client_utils", features = ["net-sim"] }
plaza_server_utils = { path = "../../server_utils" }
parking_lot = "0.12"
serde = { workspace = true }
serde_json = { version = "^1", optional = true }

plaza_ws = { path = "../../ws_client", default-features = false, optional = true }
plaza_wire = { path = "../../wire", optional = true }
plaza = { path = "../../core", optional = true }
plaza_session = { path = "../../session", features = ["actix_ws"], optional = true }
actix-web = { version = "^4", optional = true }
actix-files = { version = "^0.6", optional = true }
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# egui-macroquad is a bridge crate pinned to matching macroquad/egui versions.
macroquad = "=0.4.15"
egui-macroquad = "=0.17.3"

[lib]
name = "horde_playground"
path = "src/lib.rs"

[[bin]]
name = "horde_playground"
path = "src/main.rs"
