[package]
name = "plaza_example_ant_farm"
version = "0.1.0"
default-run = "plaza_example_ant_farm"
edition = { workspace = true }
publish = false

# `xdp` compiles the AF_XDP send arm. Linux-only by construction: the socket
# code is cfg-gated to linux and the dependency is target-gated, so on macOS
# the feature enables nothing and the plain UDP body is the only send path.
[features]
xdp = ["dep:xdpilone"]
view = ["dep:macroquad", "dep:egui-macroquad"]

[dependencies]
plaza = { workspace = true }
plaza_session = { workspace = true, features = ["msgpack"] }
plaza_wire = { workspace = true, features = ["msgpack"] }
plaza_server_utils = { workspace = true }

async-trait = { workspace = true }
macroquad = { version = "=0.4.15", optional = true }
egui-macroquad = { version = "=0.17.3", optional = true }
parking_lot = "0.12"
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
xdpilone = { version = "1", optional = true }

[[bin]]
name = "ant_farm_view"
path = "src/bin/view.rs"
required-features = ["view"]
