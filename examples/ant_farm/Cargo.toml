[package]
name = "plaza_example_ant_farm"
version = "0.1.0"
edition = { workspace = true }
publish = false

# `xdp` compiles the AF_XDP send arm. Linux-only by construction: the socket
# code is cfg-gated to linux and the dependency is target-gated, so on macOS
# the feature enables nothing and the plain UDP body is the only send path.
[features]
xdp = ["dep:xdpilone"]

[dependencies]
plaza = { workspace = true }
plaza_session = { workspace = true, features = ["msgpack"] }
plaza_wire = { workspace = true, features = ["msgpack"] }
plaza_server_utils = { workspace = true }

async-trait = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
xdpilone = { version = "1", optional = true }
