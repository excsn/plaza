[workspace]
members = [
  "ability_cooldowns",
  "playground_common",
  "card_table",
  "blackhole_playground",
  "csp_net_example",
  "horde_playground",
  "netcode_playground",
  "pong",
  "rollback_playground",
  "shared-counter",
  "timed_debuff",
  "typing_indicator",
  "whack_a_mole",
]
# The four playgrounds pull in macroquad's large dependency tree and target
# wasm, so they are kept out of the default set: a bare `cargo build`/`test`
# skips them, while `cargo <cmd> --workspace` includes them.
default-members = [
  "ability_cooldowns",
  "playground_common",
  "card_table",
  "blackhole_playground",
  "csp_net_example",
  "pong",
  "shared-counter",
  "timed_debuff",
  "typing_indicator",
  "whack_a_mole",
]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Excerion Sun <dev@excsn.com>"]
license = "MPL-2.0"
repository = "https://github.com/excsn/plaza"

[workspace.dependencies]
plaza = { path = "../core" }
plaza_client_utils = { path = "../client_utils" }
plaza_server_utils = { path = "../server_utils" }
plaza_lobby = { path = "../lobby" }
# Declared with defaults off because members disagree about them: a member can
# add features to a workspace dependency but can never turn defaults back off.
plaza_session = { path = "../session", default-features = false }
plaza_wire = { path = "../wire", default-features = false }
plaza_ws = { path = "../ws_client", default-features = false }
playground_common = { path = "playground_common" }
fibre = "0.6"
tokio = { version = "^1", features = ["full"] }
serde = { version = "^1", features = ["derive"] }
async-trait = "^0.1"
uuid = { version = "^1", features = ["v4", "serde"] }
thiserror = "^2.0"
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }
