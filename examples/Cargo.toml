[workspace]
members = [
  "foreign_soil",
  "ability_cooldowns",
  "auction_floor",
  "bomb_grid",
  "pellet_maze",
  "ghost_trials",
  "seed_defense",
  "playground_common",
  "card_table",
  "blackhole_playground",
  "csp_net_example",
  "door_policy",
  "fog_skirmish",
  "curtain_fire",
  "hit_scan",
  "horde_playground",
  "lobby_world",
  "netcode_playground",
  "pong",
  "rollback_playground",
  "shared_counter",
  "table_manners",
  "tag_arena",
  "timed_debuff",
  "typing_indicator",
  "whack_a_mole",
]
default-members = [
  "ability_cooldowns",
  "auction_floor",
  "playground_common",
  "card_table",
  "blackhole_playground",
  "csp_net_example",
  "fog_skirmish",
  "lobby_world",
  "pong",
  "shared_counter",
  "table_manners",
  "tag_arena",
  "timed_debuff",
  "typing_indicator",
  "whack_a_mole",
]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Excerion Sun <dev@excsn.com>"]
license = "MPL-2.0"
repository = "https://github.com/excsn/plaza"

[workspace.dependencies]
plaza = { path = "../core" }
plaza_client_utils = { path = "../client_utils" }
plaza_server_utils = { path = "../server_utils" }
plaza_lobby = { path = "../lobby" }
plaza_session = { path = "../session", default-features = false }
plaza_wire = { path = "../wire", default-features = false }
plaza_ws = { path = "../ws_client", default-features = false }
playground_common = { path = "playground_common" }
fibre = "0.6"
tokio = { version = "^1", features = ["full"] }
serde = { version = "^1", features = ["derive"] }
async-trait = "^0.1"
uuid = { version = "^1", features = ["v4", "serde"] }
thiserror = "^2.0"
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }
