[workspace]
# The publishable set. Examples are a separate workspace (examples/Cargo.toml);
# run ./check.sh to verify both.
members = [
  "core",
  "lobby",
  "session",
  "client_utils",
  "wire",
  "server_utils",
  "ws_client",
]
exclude = ["examples"]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Excerion Sun <dev@excsn.com>"]
license = "MPL-2.0"
repository = "https://github.com/excsn/plaza"

[workspace.dependencies]
fibre = "0.6"
tokio = { version = "^1", features = ["full"] }
serde = { version = "^1", features = ["derive"] }
async-trait = "^0.1"
uuid = { version = "^1", features = ["v4", "serde"] }
thiserror = "^2.0"
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }
