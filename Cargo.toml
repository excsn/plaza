[workspace]
members = [
  "core",
  "lobby",
  "session",
  "client_utils",
  "wire",
  "server_utils",
  "ws_client",
  "examples/ability_cooldowns",
  "examples/card_table",
  "examples/blackhole_playground",
  "examples/csp_net_example",
  "examples/horde_playground",
  "examples/netcode_playground",
  "examples/pong",
  "examples/rollback_playground",
  "examples/shared-counter",
  "examples/timed_debuff",
  "examples/typing_indicator",
  "examples/whack_a_mole",
]
# The four playgrounds (netcode, rollback, horde, blackhole) pull in macroquad's large dependency
# tree and target wasm, so they are kept out of the default set: a bare
# `cargo build`/`test`/`check` skips them, while `cargo <cmd> --workspace` includes them.
default-members = [
  "core",
  "lobby",
  "session",
  "client_utils",
  "wire",
  "server_utils",
  "ws_client",
  "examples/ability_cooldowns",
  "examples/card_table",
  "examples/blackhole_playground",
  "examples/csp_net_example",
  "examples/pong",
  "examples/shared-counter",
  "examples/timed_debuff",
  "examples/typing_indicator",
  "examples/whack_a_mole",
]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Excerion Sun <dev@excsn.com>"]
license = "MPL-2.0"
repository = "https://github.com/excsn/plaza"

[workspace.dependencies]
fibre = "0.6"
tokio = { version = "^1", features = ["full"] }
serde = { version = "^1", features = ["derive"] }
async-trait = "^0.1"
uuid = { version = "^1", features = ["v4", "serde"] }
thiserror = "^2.0"
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }