[package]
name = "plaza_session"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

authors = ["Your Name <you@example.com>"]
repository = "https://github.com/excsn/plaza"

[features]
default = ["actix_ws", "tcp"]
actix_ws = ["dep:actix", "dep:actix-ws", "dep:serde_json", "dep:tokio", "dep:parking_lot"] # Add other direct deps of actix_ws module
tcp = ["dep:tokio", "dep:serde_json", "dep:tokio-util", "dep:bytes", "dep:futures-sink"]
# udp feature would be similar

[dependencies]
plaza = { version = "^0", path = "../core" }

# General dependencies
serde = { version = "^1.0", features = ["derive"] }
uuid = { version = "^1", features = ["v4"] } # For ConnectionId generation
tracing = "^0.1"
async-trait = "^0.1"
thiserror = "^1.0"
futures-util = "^0"

# Optional dependencies for features
actix = { version = "^0.13", optional = true }
actix-ws = { version = "^0.2.5", optional = true }
bytes = { version = "^1", optional = true }
futures-sink = { version = "0.3", optional = true }
parking_lot = { version = "^0.12", optional = true }
serde_json = { version = "^1.0", optional = true } # Common for network protocols
tokio = { version = "^1", features = ["sync", "rt"], optional = true } # For mpsc, broadcast, spawn, net
tokio-util = { version = "^0.7", features = ["codec"], optional = true } # For TCP/UDP framing

[dev-dependencies]
# Common dev-dependencies
tokio = { version = "^1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }
# Feature-specific dev-dependencies if needed for examples in this crate
# actix-web = { version = "4", optional = true }