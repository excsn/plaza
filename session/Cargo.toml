[package]
name = "plaza_session"
version = "0.6.1"
edition = { workspace = true }
description = "WebSocket and TCP transports for the Plaza real-time shared-state framework, with a pluggable wire format."
readme = "README.md"
keywords = ["gamedev", "networking", "websocket", "multiplayer", "tcp"]
categories = ["game-development", "network-programming", "asynchronous"]
license = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[features]
default = ["actix_ws", "tcp"]
actix_ws = ["dep:actix-ws", "dep:actix-web", "dep:bytestring"]
tcp = ["dep:tokio-util", "tokio/net"]
actix_host = ["actix_ws", "dep:actix-files", "dep:tracing-subscriber"]

[dependencies]
plaza = { version = "0.6.0", path = "../core" }
plaza_wire = { version = "0.6.0", path = "../wire" }

serde = { version = "^1.0", features = ["derive"] }
tokio = { version = "^1", features = ["sync", "rt", "macros", "time"] }
parking_lot = "^0.12"
tracing = "^0.1"
async-trait = "^0.1"
thiserror = { workspace = true }
fibre = { workspace = true }
futures-util = { version = "^0", features = ["sink"] }

actix-web = { version = "^4", optional = true }
actix-ws = { version = "^0.3", optional = true }
actix-files = { version = "^0.6", optional = true }
tracing-subscriber = { workspace = true, optional = true }
bytes = "^1"
bytestring = { version = "^1", optional = true }
tokio-util = { version = "^0.7", features = ["codec"], optional = true }

[dev-dependencies]
tokio = { version = "^1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tokio-util = { version = "^0.7", features = ["codec"] }
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }
uuid = { version = "^1", features = ["v4", "serde"] }
